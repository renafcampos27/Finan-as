[tool.ruff]
target-version = "py314"
extend-exclude = [
    ".agents",
    "artifacts",
    "backups",
    "build",
    "dist",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]
# Qt runtime settings must be applied before importing PySide6.  This makes
# the imports that follow configure_qt_runtime() intentionally non-top-level.
ignore = ["E402"]
