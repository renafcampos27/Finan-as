[pytest]
testpaths = tests
python_files = test_*.py smoke_*.py
pythonpath = .
required_plugins = pytest-timeout==2.4.0
timeout = 120
markers =
    finance_profile(name): explicit synthetic empty or demo profile
    migration: synthetic schema migration checks
    integration: integration checks using temporary profiles and fake credentials
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
