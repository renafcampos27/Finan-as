name: Verify Windows source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      FINANCAS_PESSOAIS_TESTING: '1'
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install pinned dependencies in an isolated environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the virtual environment.' }
          & .venv/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          & .venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed.' }
      - name: Lint application and build scripts
        run: |
          & .venv/Scripts/python.exe -m ruff check database domain services ui utils scripts tests main.py LiquidGlass.spec
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed.' }
      - name: Audit runtime dependency vulnerabilities
        run: |
          & .venv/Scripts/python.exe -m pip_audit -r requirements.txt --strict --progress-spinner off
          if ($LASTEXITCODE -ne 0) { throw 'Runtime dependency audit failed.' }
      - name: Run isolated modules, then benchmarks without concurrent test load
        run: |
          & .venv/Scripts/python.exe scripts/run_isolated_tests.py --output artifacts/ci-tests --profile demo --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'One or more test modules failed; inspect the retained logs.' }
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/
          if-no-files-found: ignore
          retention-days: 14
